# Tool Delta 예측 벤치마크 — 설정
# 경로는 이 파일(LM_experiments/config.yaml) 기준 상대경로.

seed: 42

data:
  v3_results: ../data/processed/v3_results.csv # 상위 baseball2vec 프로젝트의 산출물 (읽기 전용)

transitions:
  min_pa: 200 # 전이 양 시즌 모두에 적용하는 최소 타석 필터
  # 원본에는 numeric player_id/팀 컬럼이 없다. Name을 시즌 간 대체 키로
  # 사용하되, 동일 (Name, Season)이 둘 이상이면 추정하지 않고 전부 제외한다.
  identity_key: "Name"
  duplicate_policy: "drop_all_ambiguous"
  # 원본에 Age가 없으며 사용자가 age 없이 진행하도록 확인했다.
  age_mode: "omitted_missing_source"
  windows: # [t, t+1] 전이 구간
    - [2021, 2022]
    - [2022, 2023]
    - [2023, 2024]
    - [2024, 2025]
  tool_order: [Power, Contact, Discipline, Defense, Speed] # vec5 순서 (지시서 §Phase 1 스키마 기준)
  # v3_results.csv의 실제 컬럼명은 ZScore_{tool}. tool_order의 각 이름과 아래 접두사를 결합해 참조한다.
  source_col_prefix: "ZScore_"

baselines:
  knn_k: 10
  ci_alpha: 0.05 # 95% OLS coefficient confidence intervals

lm_arms:
  # Phase 5 is provider-neutral and stub-only: no model or API SDK is selected.
  prompt_version: v1
  request_schema_version: v1
  provider_adapter: null
  anon_salt: "b2v-lm-arms-v1" # reproducible masking, not a security secret

feasibility:
  # 나이 컬럼이 원본 데이터에 없어(Phase 0 보고, 사용자 확인) 나이 구간 축은 뺀다.
  # t시즌 tool 값 구간(스카우팅 스케일 20-80 기준)만으로 조건부 Δ 분포를 산출.
  bin_edges: [20, 40, 50, 60, 70, 80]
  bin_labels: ["<40", "40-50", "50-60", "60-70", "70+"]
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]


evaluation:
  elite_percentile: 0.90
  strength_threshold: 60.0
  weakness_threshold: 45.0
  partial_eval_n: 250
output:
  tables_dir: outputs/tables
  logs_dir: outputs/logs
